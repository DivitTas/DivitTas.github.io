<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#232841" stroke-width="0.5"></path>
    </pattern>
    <pattern id="grid-minor" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#1a1f33" stroke-width="0.3"></path>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#grid-minor)"></rect>
  <rect width="200" height="200" fill="url(#grid)"></rect>
</svg>